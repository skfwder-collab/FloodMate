<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloodMate - Shark Tank Pitch MVP</title>
    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="[suspicious link removed]" rel="stylesheet">
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="[suspicious link removed]" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="main-header">
            <div class="brand">
                <i class="bi bi-water logo-icon"></i>
                <span class="brand-name">FloodMate</span>
            </div>
            <span class="badge-mvp">Shark Tank Pitch MVP</span>
        </header>

        <!-- Alert Card -->
        <section class="alert-card">
            <div class="alert-icon-box">
                <i class="bi bi-clock-history"></i>
            </div>
            <div class="alert-content">
                <h3 class="alert-title">ระบบแจ้งเตือนย้ายรถล่วงหน้า (90 นาที)</h3>
                <p class="alert-desc">ตรวจพบน้ำทะเลหนุนผสมฝนตกสะสม: แนะนำลูกบ้านซอยลาดพร้าว 64 และรามคำแหง 24 ขยับรถขึ้นอาคารจอดสำรอง</p>
            </div>
        </section>

        <!-- Interactive Map Section -->
        <section class="map-section">
            <div class="map-header">
                <i class="bi bi-geo-alt-fill text-primary"></i>
                <span>แผนที่จำลองเรดาร์น้ำท่วมระดับซอย (Interactive Map)</span>
            </div>
            <div id="map"></div>
        </section>

        <!-- Field Report Form Section -->
        <section class="card-section">
            <h2 class="section-title">
                <i class="bi bi-broadcast text-primary"></i>
                ส่งรายงานสถานการณ์ภาคสนาม
            </h2>

            <form id="reportForm" class="report-form">
                <div class="form-group">
                    <label for="locationInput">พิกัดชื่อซอย / ถนนย่อย</label>
                    <input type="text" id="locationInput" placeholder="เช่น ซอยสุขุมวิท 39 หรือ ซอยวิภาวดี 16" required>
                </div>

                <div class="form-group">
                    <label for="waterDepthSelect">ระดับน้ำโดยประมาณ</label>
                    <select id="waterDepthSelect" required>
                        <option value="0-5">ท่วมขังเล็กน้อย 0-5 ซม.</option>
                        <option value="5-10" selected>ท่วมขัง 5-10 ซม. (ขอบฟุตบาท)</option>
                        <option value="10-20">ท่วมขัง 10-20 ซม. (เสมอทางเดิน)</option>
                        <option value="20-30">ท่วมสูง 20-30 ซม. (ครึ่งล้อรถ)</option>
                        <option value="30+">ท่วมสูงเกิน 30 ซม. (มิดล้อรถ)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="passabilitySelect">สภาพการผ่านทาง</label>
                    <select id="passabilitySelect" required>
                        <option value="all">รถทุกประเภทผ่านได้</option>
                        <option value="caution">รถเล็กควรชะลอตัว</option>
                        <option value="no-small">รถเล็กห้ามผ่าน</option>
                        <option value="closed">ปิดการจราจรทุกประเภท</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="bi bi-send-fill"></i>
                    ส่งข้อมูลยืนยันสถานะ (ปักหมุดลงแผนที่)
                </button>
            </form>
        </section>

        <!-- Live Radius Feed Section -->
        <section class="feed-section">
            <div class="feed-header">
                <h3 class="feed-title">รายงานล่าสุดในรัศมี</h3>
                <div class="feed-actions">
                    <button id="clearBtn" class="btn-clear" title="ล้างข้อมูล">
                        <i class="bi bi-trash"></i> ล้างข้อมูล
                    </button>
                    <button id="refreshBtn" class="btn-refresh">
                        <i class="bi bi-arrow-clockwise"></i> รีเฟรช
                    </button>
                </div>
            </div>

            <div id="feedList" class="feed-list"></div>
        </section>
    </div>

    <!-- Leaflet JS -->
    <script src="[suspicious link removed]"></script>
    <script src="script.js"></script>
</body>
</html>
